<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Zante · 19–26 July 2027</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">ZAKYNTHOS · 19–26 JULY 2027</p>
        <h1 id="pageTitle">Your week</h1>
      </div>
      <button class="icon-button" id="addButton" aria-label="Add plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main>
      <section class="view active" id="weekView">
        <section class="trip-card">
          <div>
            <span class="trip-kicker">ZANTE</span>
            <strong>7 nights</strong>
            <p>One simple place for the whole trip.</p>
          </div>
          <div class="trip-date"><span>19</span><small>JUL</small></div>
        </section>

        <div class="day-strip" id="dayStrip" aria-label="Trip days"></div>
        <div class="day-heading">
          <div>
            <p class="eyebrow" id="selectedDate">MONDAY · 19 JULY</p>
            <h2 id="selectedDayTitle">Day 1</h2>
          </div>
          <span class="count-pill" id="planCount">0 plans</span>
        </div>
        <div id="plansList" class="list"></div>
      </section>

      <section class="view" id="ideasView">
        <div class="section-heading">
          <div><p class="eyebrow">SAVE FOR LATER</p><h2>Ideas</h2></div>
          <button class="small-add" data-open="ideaSheet">Add</button>
        </div>
        <div id="ideasList" class="list"></div>
      </section>

      <section class="view" id="packingView">
        <div class="section-heading">
          <div><p class="eyebrow">BEFORE YOU GO</p><h2>Packing</h2></div>
          <button class="small-add" data-open="packingSheet">Add</button>
        </div>
        <div class="progress-wrap">
          <div><strong id="packingProgress">0 of 0 packed</strong><span>Tap an item when it’s in the bag.</span></div>
          <div class="progress-track"><div id="progressBar"></div></div>
        </div>
        <div id="packingList" class="list"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Main navigation">
      <div class="tab-indicator" id="tabIndicator"></div>
      <button class="tab active" data-view="weekView" data-title="Your week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14v15H5z"/></svg><span>Week</span>
      </button>
      <button class="tab" data-view="ideasView" data-title="Ideas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M8.4 15.4A6.5 6.5 0 1 1 15.6 15.4C14.6 16.2 14 17 14 18h-4c0-1-.6-1.8-1.6-2.6Z"/></svg><span>Ideas</span>
      </button>
      <button class="tab" data-view="packingView" data-title="Packing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M5 7h14v14H5zM9 7v14M15 7v14"/></svg><span>Packing</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop hidden" id="planSheet">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="planSheetTitle">
      <div class="grabber"></div>
      <header><button class="text-button" data-close>Cancel</button><h3 id="planSheetTitle">Add plan</h3><button class="text-button strong" form="planForm">Save</button></header>
      <form id="planForm">
        <label><span>What are you doing?</span><input id="planTitle" required placeholder="Boat day"></label>
        <div class="two-col">
          <label><span>Start</span><input id="planTime" type="time" required></label>
          <label><span>End</span><input id="planEnd" type="time"></label>
        </div>
        <label><span>Day</span><select id="planDay"></select></label>
        <label><span>Location</span><input id="planLocation" placeholder="Laganas"></label>
        <label><span>Notes</span><textarea id="planNotes" placeholder="Anything worth remembering"></textarea></label>
      </form>
    </section>
  </div>

  <div class="sheet-backdrop hidden" id="ideaSheet">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="ideaSheetTitle">
      <div class="grabber"></div>
      <header><button class="text-button" data-close>Cancel</button><h3 id="ideaSheetTitle">New idea</h3><button class="text-button strong" form="ideaForm">Save</button></header>
      <form id="ideaForm">
        <label><span>Idea</span><input id="ideaTitle" required placeholder="Rent jetskis"></label>
        <label><span>Note</span><textarea id="ideaNote" placeholder="Optional"></textarea></label>
      </form>
    </section>
  </div>

  <div class="sheet-backdrop hidden" id="packingSheet">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="packingSheetTitle">
      <div class="grabber"></div>
      <header><button class="text-button" data-close>Cancel</button><h3 id="packingSheetTitle">Add item</h3><button class="text-button strong" form="packingForm">Save</button></header>
      <form id="packingForm">
        <label><span>Item</span><input id="packingText" required placeholder="Sunscreen"></label>
      </form>
    </section>
  </div>
</body>
</html>
