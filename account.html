<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Zante · Account</title>
  <link rel="stylesheet" href="css/account.css">
  <script src="js/account.js" defer></script>
</head>
<body>
  <main class="account-page">
    <header class="account-topbar">
      <button class="back-button" id="backButton" type="button" aria-label="Back to planner">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
      </button>
    </header>

    <section class="auth-wrap" aria-labelledby="authTitle">
      <div class="auth-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4.5 20c.8-4 3.3-6 7.5-6s6.7 2 7.5 6"/></svg>
      </div>

      <div class="auth-heading">
        <p class="eyebrow">ZANTE ACCOUNT</p>
        <h1 id="authTitle">Sign in</h1>
        <p id="authSubtitle">Use your username and password.</p>
      </div>

      <form id="authForm" novalidate>
        <label>
          <span>Username</span>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>

        <label>
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>

        <label class="confirm-field hidden" id="confirmField">
          <span>Confirm password</span>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password">
        </label>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <button class="primary-button" id="submitButton" type="submit">Sign in</button>
      </form>

      <button class="switch-button" id="switchButton" type="button">Add account</button>

      <p class="device-note">Accounts are currently saved only on this device.</p>
    </section>
  </main>
</body>
</html>
